# Uncomment the following line to enable deep sleep
# CONFIG_ZMK_SLEEP=y

# Uncomment the following line to increase the keyboard's wireless range
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Enable eager debouncing
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10

# Enable ZMK Studio for Realtime Keymap Updates
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# OLED display with the custom fireplace widget (see config/src/).
# The central screen draws three canvases plus the fire. The default 2 KB
# LVGL heap and 2 KB UI thread stack are enough for the peripheral screen
# and not for this one — the UI thread dies and the panel looks broken.
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096
CONFIG_LV_Z_MEM_POOL_SIZE=8192
CONFIG_LV_Z_VDB_SIZE=100
CONFIG_LV_Z_FULL_REFRESH=y
CONFIG_FIREPLACE_WIDGET=y
# Fireplace knobs (defaults shown; uncomment to change)
# CONFIG_FIREPLACE_FRAME_MS=150
# CONFIG_FIREPLACE_WORK_MINUTES=30
# CONFIG_FIREPLACE_BREAK_SECONDS=60
# CONFIG_FIREPLACE_RESET_IDLE_SECONDS=60
# CONFIG_FIREPLACE_PAUSE_REMINDER=n
# CONFIG_FIREPLACE_IDLE_FREEZE=n

# Uncomment the following line to enable USB Logging (this increases power usage by a significant amount, turn it off when not in use)
# CONFIG_ZMK_USB_LOGGING=y
